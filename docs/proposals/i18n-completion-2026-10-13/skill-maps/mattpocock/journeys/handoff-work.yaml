title: Hand work to another agent or person
summary: Choose a context handoff or a questionnaire for external decision gaps according to the receiver.
order: 7
when_to_use:
  - Move to a new harness or directory, a colleague or a side task.
  - Only another stakeholder can supply the blocking information.
inputs:
  - Current work state or decision gap
outputs:
  - Portable handoff or questionnaire
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/ask-matt/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: productivity/handoff/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: productivity/to-questionnaire/SKILL.md
variants:
  - id: agent-handoff
    title: New harness, directory, colleague or side task
    when: A portable artifact is needed. At an ordinary phase boundary first consider continuing, clearing,
      compacting or delegating.
    steps:
      - title: Condense portable context
        why: The user starts handoff to record goals, decisions, state, evidence, skills used, file pointers and next
          steps.
        nodes:
          - handoff
        outputs:
          - Handoff Markdown in the operating system's temporary directory
  - id: human-questionnaire
    title: Obtain missing information from another person
    when: The blocker is information or a decision held by an external stakeholder.
    steps:
      - title: Confirm the questionnaire recipient and required result
        why: The user starts to-questionnaire. Establish whom it is for and what must come back, then create an
          asynchronously answerable questionnaire. Generating it does not send it.
        nodes:
          - to-questionnaire
        outputs:
          - Markdown questionnaire for the identified recipient
      - title: Bring answers back to the design or specification
        why: Answers are new material. Depending on readiness, the user continues grill-with-docs or synthesizes
          to-spec; neither starts automatically.
        nodes:
          - grill-with-docs
          - to-spec
        outputs:
          - Completed design decisions or specification input
        optional: true
        when: Answers are available and the original work should continue.
