title: Fix a difficult bug
summary: Establish failing feedback that captures the actual symptom, then minimize, hypothesize, instrument
  and fix. Leave a regression when the correct seam exists; otherwise record the testability gap.
order: 4
when_to_use:
  - The bug resists first-pass analysis or involves flakes, regressions or performance anomalies.
inputs:
  - bug symptom
  - Runnable system
outputs:
  - Root-cause evidence and fix
  - Regression protection at the correct seam, or a missing-seam finding
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/ask-matt/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/diagnosing-bugs/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/code-review/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
