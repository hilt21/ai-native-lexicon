title: type-system-discipline
summary: Use the type system to make invalid states hard to express.
type: principle
status: active
layer: principle
primary_cluster: principles
secondary_clusters: []
tags:
  - principle
mechanism: Use the type system to make invalid states hard to express.
when_to_use:
  - Apply when designing types, reviewing a function signature, or writing code in any statically-typed
    language. Make illegal states unrepresentable, brand semantic primitives, parse external data at
    boundaries, refuse to lie to the compiler, exhaust variants, derive from authoritative schemas.
solves:
  - Use the type system to make invalid states hard to express.
inputs:
  - domain constraints / external data
outputs:
  - strong types / parsed boundaries
