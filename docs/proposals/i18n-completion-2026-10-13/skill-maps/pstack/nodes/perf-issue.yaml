title: perf-issue
summary: Measure, fix and demonstrate a one-off performance problem.
type: playbook
status: active
layer: playbook
primary_cluster: verification-evidence
secondary_clusters: []
tags: []
mechanism: Capture a baseline trace, apply benchmark-checklist, ground with how, order hypotheses by the
