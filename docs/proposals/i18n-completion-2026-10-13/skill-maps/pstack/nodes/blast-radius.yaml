title: blast-radius
summary: Find effects beyond the diff and demonstrate safety assumptions through actual execution.
type: capability
status: active
layer: skill
primary_cluster: design-decision
secondary_clusters:
  - verification-evidence
tags:
  - risk
  - verification
  - review
mechanism: Identify the facts on which change safety depends. Trace callers, consumers and implicit
  assumptions, then verify the facts with a script or actual run.
when_to_use:
  - A small diff has uncertain risk.
  - Change an API or data structure.
  - Check safety before shipping.
solves:
  - Avoid review limited to the local diff.
  - Identify hidden dependencies.
inputs:
  - diff
  - repository graph
  - runtime or data surface
outputs:
  - blast-radius map
  - critical safety fact
  - proof
  - residual risks
source_refs:
  - source: pstack-0-15-15-df581122
    path: skills/blast-radius/SKILL.md
handoffs: []
official_description: Find what a change could break somewhere else before it ships, beyond the diff, and
  prove the one fact it's safe because of by running real code instead of writing it up. Use for 'blast radius
  of X', 'what could this break', or reviewing a small diff you don't trust.
