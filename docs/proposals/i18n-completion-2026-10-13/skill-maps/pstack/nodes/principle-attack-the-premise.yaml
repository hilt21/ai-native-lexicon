title: attack-the-premise
summary: After repeated failed fixes, stop carrying the shared premise forward and recheck it.
type: principle
status: active
layer: principle
primary_cluster: principles
secondary_clusters: []
tags:
  - principle
mechanism: After repeated failed fixes, stop carrying the shared premise forward and recheck it.
when_to_use:
  - Apply when two or more fixes that share one premise have failed the same gate. Take a census of which
    actors hold the imbalance before the next fix, then question the premise instead of writing another fix
    that assumes it.
solves:
  - After repeated failed fixes, stop carrying the shared premise forward and recheck it.
inputs:
  - repeated failed fixes
outputs:
  - reframed premise / new hypothesis
