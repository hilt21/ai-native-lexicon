mechanism: Review comments and remove explanations already carried by code. If a comment states an actual
  invariant, recommend a type, test, lint rule or runtime check.
when_to_use:
  - AI generates excessive comments.
  - Clean up before PR review.
  - A comment asserts a required constraint.
solves:
  - Reduce stale comments.
  - Prevent comments from setting incorrect precedents.
inputs:
  - diff or source files
outputs:
  - cleaner code
  - structural encodings for real constraints
