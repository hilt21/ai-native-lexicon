title: writing-for-agents
summary: Write steering and reference documents that agents can reliably consume.
type: discipline
status: active
layer: discipline
primary_cluster: communication-tooling
secondary_clusters:
  - architecture-quality
tags:
  - productivity
  - model-invoked
  - stable
mechanism: Use this writing reference for skills, AGENTS.md, CLAUDE.md and pointer documents. Account for
  agent context load and human cognitive load, define completion criteria, disclose branch-specific detail
  progressively, co-locate related guidance and prune no-op or irrelevant rules. Apply it to the current
  document task; it does not generate every document automatically. Read the separate skill-mechanics guidance
  when creating an actual skill.
when_to_use:
  - Create or modify a skill.
  - Write AGENTS.md, CLAUDE.md or another agent-facing document.
solves:
  - Reduce noise in the agent context.
  - Make rules and reference material easier to find and apply correctly.
inputs:
  - Agent-facing document goal
  - Existing project structure
outputs:
  - Documents better suited to agent consumption
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: productivity/writing-for-agents/SKILL.md
handoffs: []
official_description: Writing documents for agents. Use when creating or editing skills, or modifying AGENTS.md or CLAUDE.md.
