term: "Long-Term Memory"
zh: "长期记忆"
category: "Memory"
status: "foundational"
summary: "Keep useful knowledge available for future tasks."
definition: "Long-term memory persists selected information beyond the current task or session and makes it retrievable later. Stored notes are not automatically loaded into context, and persistence alone does not establish their accuracy."
why_it_matters: "Reusable knowledge can reduce repeated work, provided the system checks relevance, freshness, and the user's retention expectations."
when_to_use: "Use it to retain a confirmed project convention that will matter in later sessions."
anti_pattern: "Saving every interaction indefinitely and treating old notes as current instructions."
related: ["working-memory", "memory-consolidation", "forgetting"]
primitives: ["memory"]
sources: []
