term: "Permission"
zh: "权限"
category: "Governance"
status: "foundational"
summary: "Decide what the agent is allowed to access or do."
definition: "A permission grants an actor access to a resource or operation within a defined scope. It is enforced by the system that controls the resource; a task request or model instruction does not itself create that access."
why_it_matters: "Scoped access limits the impact of mistakes and makes the boundary of authorized actions technically checkable."
when_to_use: "Use it to give an agent read access to one project while withholding unrelated resources."
anti_pattern: "Granting broad write credentials for a task that only requires reading a single document."
related: ["permission-boundary", "approval", "tool"]
tags: ["governance", "permission-boundary"]
