term: Agent Loop
zh: 智能体循环
category: Agent Architecture
status: foundational
summary: The recurring cycle in which an agent observes state, chooses an action, executes it, and incorporates the result into its next decision.
definition: An agent loop is the control structure that turns a model call into an adaptive process. A robust loop makes observations, decisions, actions, stopping conditions, and errors explicit rather than hiding them inside an open-ended conversation.
why_it_matters: Reliability problems often live between model calls. Exposing the loop makes retries, budgets, termination, tracing, and human intervention testable.
when_to_use: Use it for tasks that require multiple dependent actions or adaptation to tool results.
anti_pattern: Repeating model calls indefinitely without a progress measure, stop condition, or failure state.
related: [plan-execute-observe, harness, golden-trace, checkpoint-resume]
