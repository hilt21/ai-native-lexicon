  - path: mechanism
    translation: 协调器通过 Task 分派工作，在 Project 跟踪器和存储中记录进度。运行环境支持时订阅 PR 与 CI 事件。先跑通一个完整单元，每个 PR 只指定一名写入者，由独立验证者核对当前提交。协调器不写代码、不轮询、不转发代理消息，也不调用旧 orch 脚本。
