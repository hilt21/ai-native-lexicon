  - path: official_description
    translation: "Keep a reviewable decision trail for long-running or unattended work: a TSV log with one row per decision (what, why, evidence, result). Local by default; commit it when a reviewer needs the trail to trust the result. Use for /show-me-your-work, autonomous or multi-phase runs, or work a human reviews after stepping away."
    language: en
    source_fingerprint: sha256:27cb6eb178a55203db24e530131675d5a6675876193eef9542ba108f39ced738
    review_status: reviewed
    reviewed_at: 2026-10-13
