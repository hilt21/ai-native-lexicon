  - path: mechanism
    translation: 调查 Surface / Run / Drive / Observe / Isolate，生成 Launch、Doctor、Drive、Evidence、Cleanup 和 Feature Map，并实际跑通一次。确认应用可从空数据目录启动并达到可用状态，建立面向用户的功能地图，并检查清理后证据仍可读取。
