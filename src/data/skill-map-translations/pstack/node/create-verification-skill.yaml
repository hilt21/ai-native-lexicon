  - path: official_description
    translation: Generate a project-local verification skill that drives your app the way a user does — any language, framework, or platform. Use for /create-verification-skill, "make a control skill for this repo", or when a project has no scripted way to prove UI/CLI/service behavior.
    language: en
    source_fingerprint: sha256:c02f162d23bc3e33359f97834b61ec96556612357ed57d57cede402e0d23a46c
