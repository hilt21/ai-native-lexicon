  - path: official_description
    translation: "Apply before you measure, and before you trust, report, or act on a number you measured: a speedup, a regression, a throughput, a latency, or an eval result. Find what limits it, and rule out that it measured something other than the work you think."
    language: en
    source_fingerprint: sha256:c10e9d58836a05c52bb030114b5f2afbf520d9ab750acb4873dd28bc7a9dcd1c
