  - path: mechanism
    translation: 任何数字先解释 limiter 和测量机制。 测量前写明决策与噪声下限；找出瓶颈资源，排除跳过工作、缓存命中和错误配置等替代解释。
    language: zh-CN
    source_fingerprint: sha256:08b340c4860150b855809e916355a9b8657fca7822b3b8729a276c136aba4e08
