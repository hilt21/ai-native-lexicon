  - path: official_description
    translation: Spawn N parallel candidates at the same task, pick a base, graft the strongest parts of the losers into it. Use for /arena, 'arena this', 'throw it in the arena', or when one attempt at a non-trivial artifact would lock in the wrong shape.
    language: en
    source_fingerprint: sha256:2236f31d517f3f866fc3b899de6a67206184803ae4de5e2c4d54cb2bb1037698
