  - path: mechanism
    translation: 三个并行 reviewer 从不同角度分析 active transcript，综合 learnings，并把每条落到现有 skill 的可执行修改或 backlog。 仅定位当前工作区的活跃对话记录。区分拟采纳改动、拒绝建议和待办事项；应用拟采纳改动前取得明确批准。
