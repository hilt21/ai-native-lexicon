  - path: official_description
    translation: Spawn three parallel review subagents over the active transcript, surface learnings, and route each to a concrete edit on an existing skill. Use when the user says reflect.
    language: en
    source_fingerprint: sha256:dcaa306ffa4aef354d7d41988799b043202bde20d722c85dd3b395e90ee6c912
