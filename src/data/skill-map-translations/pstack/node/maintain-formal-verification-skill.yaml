  - path: official_description
    translation: "Bring a project's formal verification back in line with the code after the code changes: find the commits that touched verified code, update the model, harness, or properties to describe the code as it is now, rerun, and say whether each failure is drift in the verification or a bug in the code. Use for /maintain-formal-verification-skill, \"is the model still true to the code\", or after merges and refactors that touched verified code without rechecking it."
    language: en
    source_fingerprint: sha256:ced565e5015a8e679a6a1a0cb1bbe7686c1eef029070b627fc01ae8252026d35
    review_status: draft
  - path: mechanism
