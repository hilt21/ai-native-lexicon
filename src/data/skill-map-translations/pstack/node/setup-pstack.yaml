  - path: official_description
    translation: Configure which models pstack uses per role and at what reasoning budget. Detects your available models and writes an always-applied rule that overrides the skill defaults. Use for /setup-pstack, "configure pstack models", "pstack budget", or changing pstack's model choices.
    language: en
    source_fingerprint: sha256:4dafe2c7e1a52d381eaf8dd2f15977069f2985e54a593b7d91e8704a86091c7d
