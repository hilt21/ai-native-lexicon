  - path: official_description
    translation: Apply when designing commands, lifecycle steps, or processing loops that run amid crashes, restarts, and retries. Converge to the same end state regardless of partial prior runs.
    language: en
    source_fingerprint: sha256:2444d65a99d954816cfaebbacfdfab3c69c98ea64272689dafbbbff1111c3a77
    review_status: draft
  - path: mechanism
    translation: 把 crash/retry 当正常路径设计，重复执行仍收敛同一结果。 依据当前可观测状态决定修改，并让后续执行能识别中断留下的状态。
    language: zh-CN
    source_fingerprint: sha256:8008bcb83697ca9738a392a56ba932022fb452696e4dbd09b3aae0831afdddbb
    review_status: draft
  - path: when_to_use.0
    translation: 设计会经历崩溃、重启和重试的命令、生命周期步骤或处理循环时使用。无论之前运行完成到哪一步，都应收敛到相同最终状态。
    language: zh-CN
