  - path: official_description
    translation: Grill the user relentlessly about a plan, decision, or idea. Use when the user wants to stress-test their thinking, or uses any 'grill' trigger phrases.
    language: en
    source_fingerprint: sha256:3a66f60c7d7fc3fbe911096ec4b5209d46611556a1c6a99e24cb22daf2557a05
    review_status: reviewed
    reviewed_at: 2026-11-12
  - path: mechanism
    translation: 维护待决问题 frontier，每轮提出所有已经就绪的问题及建议，等待用户回答。可查事实通过探索取得，偏好和产品决定由用户选择；只有 frontier 清空且用户确认共同理解后才结束，不替用户模拟答案。让回答“是”表示接受建议。可查明的事实交给使用新上下文的子代理，其余未阻塞问题继续讨论。
    language: zh-CN
    source_fingerprint: sha256:eca6a706b060554e94c15690c9b3398ca379d790a9a7fb37f42f57bac82218b0
    review_status: reviewed
    reviewed_at: 2026-11-12
