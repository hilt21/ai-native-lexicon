  - path: mechanism
    translation: 用户显式启动后，从现有对话和代码库综合目标、范围及决策，不重新采访需求；采用领域词汇和 ADR。优先提出少量、尽可能高层的现有测试 seam，并向用户确认，再将 spec 发布到已配置的 issue tracker，标记为 agent-ready。若 tracker 配置缺失，先完成 setup。
