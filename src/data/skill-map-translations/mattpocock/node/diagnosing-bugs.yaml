  - path: official_description
    translation: Diagnosis loop for hard bugs and performance regressions. Use when the user says "diagnose"/"debug this", or reports something broken/throwing/failing/slow.
    language: en
    source_fingerprint: sha256:cc21fa4ddab35602cc4c7864bc8bbf5502ec9540c7a7d5b5e49c074266e04fe6
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 先实际运行一个能捕获此 bug 精确症状的快速反馈命令并看到失败；flake 先提高并固定复现率。再逐项缩小 repro、列出可证伪假设并 instrument。只有存在能表达真实调用模式的正确 seam 时，才先写失败回归测试、修复并看其通过；否则记录缺少 seam 这一发现。最后重跑原始场景、清理 debug instrumentation 并记录根因。没有反馈入口时先说明尝试与访问缺口，不靠猜测继续。
    language: zh-Hans
    source_fingerprint: sha256:f6256cb519dc949d7d44227fca0c42a25ee24fa2aafd984b16572771639b7dc4
    review_status: reviewed
    reviewed_at: 2026-10-13
