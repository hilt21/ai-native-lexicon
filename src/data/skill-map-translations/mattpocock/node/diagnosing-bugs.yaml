  - path: official_description
    translation: Diagnosis loop for hard bugs and performance regressions. Use when the user says "diagnose"/"debug this", or reports something broken/throwing/failing/slow.
    language: en
    source_fingerprint: sha256:8fdba0306aaa32364ee7a1b6d27b1340ba8224dbd4fa99cc563f24090f74a960
    review_status: draft
  - path: mechanism
    translation: 先实际运行一个能捕获此 bug 精确症状的快速反馈命令并看到失败；flake 先提高并固定复现率。再逐项缩小 repro、列出可证伪假设并 instrument。只有存在能表达真实调用模式的正确 seam 时，才先写失败回归测试、修复并看其通过；否则记录缺少 seam 这一发现。最后重跑原始场景、清理 debug instrumentation 并记录根因。没有反馈入口时先说明尝试与访问缺口，不靠猜测继续。 若通过修改代码或夹具制造回归失败，先与未改动副本比较，确认修改生效。
    language: zh-CN
    source_fingerprint: sha256:ac0e801e13bec854f91bd5530f1a854edf63e5ca927e7c5988880df20d8e5ccb
    review_status: draft
