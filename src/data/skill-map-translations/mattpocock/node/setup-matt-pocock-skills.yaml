  - path: mechanism
    translation: 用户显式启动后先探索仓库，再建议 issue tracker，确认配置草稿后写 docs/agents 的 tracker、domain 与必要 triage-labels 文档，并更新现有 CLAUDE.md/AGENTS.md 指针。默认采用 single-context 文档布局，只有真实 monorepo 才询问多 context；未安装 triage 时可跳过标签配置。它配置项目约定而不安装技能，切换 tracker 时可重跑或直接编辑配置。
