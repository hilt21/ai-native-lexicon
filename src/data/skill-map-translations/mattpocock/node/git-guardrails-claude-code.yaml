  - path: official_description
    translation: Set up Claude Code hooks to block dangerous git commands (push, reset --hard, clean, branch -D, etc.) before they execute. Use when user wants to prevent destructive git operations, add git safety hooks, or block git push/reset in Claude Code.
    language: en
    source_fingerprint: sha256:c2c545f0277a89d6402ef77f8555ff770c4ce2ecdb09c8f622b6f3f84a15a0e6
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 为 Claude Code 的项目或全局范围配置 PreToolUse Bash hook，在命令执行前拦截所有 git push 以及 reset --hard、clean、branch -D 等指定危险操作，并可按需求调整规则。push 是否有破坏性与它被策略阻止是不同判断；这些 hooks 不是所有 harness 通用的保护。
    language: zh-Hans
    source_fingerprint: sha256:a3df80eb2c7447164015affd65b41019bafb8fc6436d4e2a14b97a1af98776c2
    review_status: reviewed
    reviewed_at: 2026-10-13
