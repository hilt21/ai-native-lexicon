  - path: mechanism
    translation: 只在用户事先确认的公共 seam 上，以一个 vertical slice 为单位先写失败测试，再做最小实现使测试通过（red→green），预期来自需求或独立事实。重构不属于实现循环，而在 code-review 审查阶段处理。单独使用时也需先约定 seam。逐一说明每个候选测试接口能发现什么、会漏掉什么。
