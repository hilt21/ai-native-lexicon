  - path: mechanism
    translation: 用户显式启动后，按 spec 或票据工作，在已经确认的公共 seam 上尽可能使用 TDD 的 red→green 小片实现，期间运行类型检查和相关测试，末尾运行完整测试并调用 code-review，最后提交到当前分支。TDD 与 review 是这条实施路径包含的能力，不需要用户完成实施后再重复手工启动。
