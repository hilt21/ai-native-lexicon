  - path: mechanism
    translation: 用户显式启动后，先用两轮交流明确收件人的角色、背景与要拿回的结果，再围绕真正信息缺口生成当前目录的 to-questionnaire-<slug>.md；按主题优先级组织问题和回答空位。技能只写问卷，由读者分发并把收到的回答带回原讨论。
