  - path: mechanism
    translation: 用户显式启动后先澄清学习 mission 与可信资料，在当前目录建立可持续的教学 workspace，用带引用的短篇交互 HTML lessons、reference HTML、学习记录和可复用资产支持跨 session 学习。mission 变化需用户确认；记录和重复练习旨在长期保留理解，不承诺掌握结果。 教学状态文件以调用目录为基准，格式参考以技能目录为基准。题目选项长度保持接近，正确选项位置应变化。
