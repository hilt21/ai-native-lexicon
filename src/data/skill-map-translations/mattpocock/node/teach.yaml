    translation: 用户显式调用后，先确认学习目标和可信来源。学习状态存放于调用目录，格式参考从技能目录读取。使用带引用的简短交互式 HTML 课程、参考材料和重复练习。测验选项的词数应相同，字符数也尽可能一致；正确选项的位置应变化。学习目标变更须经用户确认。
