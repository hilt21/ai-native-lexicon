  - path: mechanism
    translation: 仅迁移测试文件中作为数据构造的类型断言：fromPartial 表达部分有效数据，fromExact 表达完整对象，fromAny 用于有意构造的非法值。安装所需依赖并类型检查；故意无效的测试值不会因工具转换而变成正确数据。
