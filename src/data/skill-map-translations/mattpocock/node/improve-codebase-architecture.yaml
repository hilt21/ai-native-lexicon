  - path: official_description
    translation: Scan a codebase for deepening opportunities, present them as a visual HTML report, then grill through whichever one you pick.
    language: en
    source_fingerprint: sha256:48788970412b3f809688d26b7bb3e14a27308809007ab2ec08545f92dd6fcf37
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 用户显式启动后，先读取 codebase-design，结合仓库现状、历史与热点委派 survey，查找能隐藏更多复杂度的 deepening opportunities，并用 deletion test 检查改进意义。生成临时 HTML 候选报告，等待用户选择一个方向后，再通过 grilling 与 domain-modeling 深入设计；调查阶段不自动改源码或实施所有候选。
    language: zh-Hans
    source_fingerprint: sha256:3e590d5a3d1978ebfbfc65840de08414e23754a2ed153a4d0297f17250fe0b61
