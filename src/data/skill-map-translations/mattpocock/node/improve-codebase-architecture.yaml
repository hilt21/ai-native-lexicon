  - path: official_description
    translation: Scan a codebase for deepening opportunities, present them as a visual HTML report, then grill through whichever one you pick.
    language: en
    source_fingerprint: sha256:b5453d42b980d62618b3c02490eae396034c1621855a1c034bcec2eff71007a2
    review_status: reviewed
    reviewed_at: 2026-11-12
  - path: mechanism
    translation: 用户显式启动后，先读取 codebase-design，结合仓库现状、历史与热点委派 survey，查找能隐藏更多复杂度的 deepening opportunities，并用 deletion test 检查改进意义。生成临时 HTML 候选报告，等待用户选择一个方向后，再通过 grilling 与 domain-modeling 深入设计；调查阶段不自动改源码或实施所有候选。让使用新上下文的子代理走查代码库，记录实际遇到的障碍。
    language: zh-CN
    source_fingerprint: sha256:34d5c73f2165094e405a42a83fa06af0de9808ebc51b5b1691d722c3da21b4a3
    review_status: reviewed
