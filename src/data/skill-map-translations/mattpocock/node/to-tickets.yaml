  - path: official_description
    translation: Break a plan, spec, or the current conversation into a set of tracer-bullet tickets, each declaring its blocking edges, published to the configured tracker (edges as text in one file per ticket locally, or native blocking links on a real tracker).
    language: en
    source_fingerprint: sha256:259813a13439c9dcaefba3916aca947888b4bfd43fb20a327be2fb6ccfc61eff
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 用户显式启动后，读取完整 plan/spec/讨论与代码，把工作拆成每票在一个新 context 内可完成、能独立演示或验证的完整 vertical tracer bullet；需要的 prefactor 先做，无法逐片保持有效的宽机械重构采用 expand–migrate–contract 例外。向用户确认 granularity、合并/拆分与 blocking edges 后发布；本地一票一文件，真实 tracker 使用相应阻塞关系，不关闭或修改父票。产生的票据已 agent-ready，无需再 triage。
    language: zh-Hans
    source_fingerprint: sha256:03dce1c60e521c0b767139512b52f31950269d0b1e2f3476556c048f30a34dfb
    review_status: reviewed
    reviewed_at: 2026-10-13
