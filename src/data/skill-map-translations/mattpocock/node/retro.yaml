  - path: mechanism
    translation: 用户显式启动复盘后，先读取 writing-for-agents，再查指定 session 的原始记录；未指定时采用当前 session。按导航、自动检查、编码标准、steering、工具成本和信息访问查找候选，将机械问题建议为确定性检查，将判断问题建议为审查标准。按严重度呈现环境改进候选供人选择，不自动把所有建议应用到代码或环境。
