  - path: official_description
    translation: "Review the changes since a fixed point (commit, branch, tag, or merge-base) along two axes: Standards (does the code follow this repo's documented coding standards?) and Spec (does the code match what the originating issue/spec asked for?). Runs both reviews in parallel sub-agents and reports them side by side. Use when the user wants to review a branch, a PR, work-in-progress changes, or asks to \"review since X\"."
    language: en
    source_fingerprint: sha256:7e3b0cbd41ce32b134eb90adea2ef772e94bb685a447bfdf314f2c0f26d31a1f
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 从指定 fixed point 计算 diff，由两个独立 reviewer 分别检查仓库标准（Standards）与规格符合度（Spec），并列报告各轴的发现与结果；不把不同轴压成一个混合 verdict。重构与标准约束在审查阶段处理。
    language: zh-Hans
    source_fingerprint: sha256:90d5325cbe95f38b1631d66b5c8a210adf98f977e61ddec8d0c486f7db67f905
    review_status: reviewed
    reviewed_at: 2026-10-13
