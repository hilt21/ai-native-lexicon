    translation: 把目标、已做决策、当前状态、证据、所用技能及关键文件指针写成操作系统临时目录中的独立 Markdown。适用于新 harness、新目录、交给同事或在阶段中分出侧任务；普通阶段边界先判断是否继续、清空上下文、委派或压缩，并非每次都要 handoff。
