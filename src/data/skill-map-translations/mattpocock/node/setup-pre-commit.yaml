  - path: official_description
    translation: Set up Husky pre-commit hooks with lint-staged (Prettier), type checking, and tests in the current repo. Use when user wants to add pre-commit hooks, set up Husky, configure lint-staged, or add commit-time formatting/typechecking/testing.
    language: en
    source_fingerprint: sha256:a09975ff7a93ac12a8f0ab1f85d5a591846a6efd27aa8fb0e8199b299240d5c9
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 检测项目包管理器，复用已有 formatter 配置，接入 Husky、lint-staged 与 Prettier。只有对应 npm/package scripts 存在时才接入类型检查和测试；缺少的脚本省略并报告。完成 smoke check 后提交 hooks/config 变更，不承诺每个项目都具有完整测试。
    language: zh-Hans
