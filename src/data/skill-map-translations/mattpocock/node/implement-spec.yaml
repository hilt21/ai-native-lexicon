  - path: mechanism
    translation: 用户显式启动整个 spec 的实施。把票据及 blocking edges 读作 task graph，先建立 integration branch，在 ready frontier 上委派 implementer subagents，各自在 worktree 内用已约定 seam 的 TDD 实现并提交，同步 integration tip 后由编排者合并；所有票据完成后统一 code-review。它与逐票 implement 是选择关系，不是先后必经阶段。
    language: zh-Hans
    source_fingerprint: sha256:ae83d385cd32cd61a9bc61dc91279b1235627cf2e5cc755637081249193596dc
    review_status: reviewed
    reviewed_at: 2026-10-13
