  - path: mechanism
    translation: 用户显式启动整个 spec 的实施。把票据及 blocking edges 读作 task graph，先建立 integration branch，在 ready frontier 上委派 implementer subagents，各自在 worktree 内用已约定 seam 的 TDD 实现并提交，同步 integration tip 后由编排者合并；所有票据完成后统一 code-review。它与逐票 implement 是选择关系，不是先后必经阶段。每个票据实施者使用独立的新上下文；集成审查发现的问题交给另一个使用新上下文的实施者。
    language: zh-CN
    source_fingerprint: sha256:0c02f8581f79919f83c75281cec706925b8e797d518903b9c8514d2f729a67da
    review_status: reviewed
    reviewed_at: 2026-11-12
