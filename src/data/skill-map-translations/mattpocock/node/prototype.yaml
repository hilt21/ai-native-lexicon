  - path: official_description
    translation: Build a throwaway prototype to answer a design question. Use when the user wants to sanity-check whether a state model or logic feels right, or explore what a UI should look like.
    language: en
    source_fingerprint: sha256:d3fdb8117e7946ea6299899f5c9ae836113b99a7d9ce993e4b2f9f2c2268d04f
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 围绕一个设计问题快速写出标为 throwaway 的原型，代码放在相关模块或页面附近。逻辑问题用可分享的单文件 HTML，UI 问题在同一路由展示明显不同的方案；默认无持久化，显式显示状态。验证后把结论带回真实工作，把原型提交到 main 之外的临时分支，并在实施 issue 留下问题、结论和分支指针。跨目录或 harness 的探索可经 handoff 往返。
    language: zh-Hans
    source_fingerprint: sha256:8acd906de9a244a247a3fc1ef0f6cb3ee6a78c3104d6d9c536bdfb13855f8438
    review_status: reviewed
    reviewed_at: 2026-10-13
