  - path: official_description
    translation: Move issues and external PRs through a state machine of triage roles, categorise, verify, grill if needed, and write agent-ready briefs.
    language: en
    source_fingerprint: sha256:85f12f99266d496c1e15fc62157c144fdbe20ab1a3bd00e1e64e3bcc6f78dcca
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 用户显式启动后，针对原始外部 bug report、feature request 或指定 PR，按配置角色与状态收集上下文，先提出分类及状态建议并等待维护者方向，然后验证 bug 或 diff，必要时通过 grilling 与 domain-modeling 补齐信息。结果可为 needs-info、ready-for-human、wontfix 或 agent-ready brief 等状态，并非每项都进入实施。外部 PR 自动发现开关默认关闭；to-tickets 已准备好的票据无需再次 triage。
    language: zh-Hans
    source_fingerprint: sha256:bebaaa593255c42e7d0d5962866971cbb6ec988fe08d710dc67048c8a1543f55
    review_status: reviewed
