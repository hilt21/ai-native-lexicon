  - path: official_description
    translation: Plan a huge chunk of work (more than one agent session can hold) as a shared map of decision tickets on your issue tracker, and resolve them one at a time until the way to the destination is clear.
    language: en
    source_fingerprint: sha256:84c4b79c17a3c811266f3f0c62e6015513fbf97704bdb68b75b296c778b226d8
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 用户显式启动后，针对太大且路线尚不清晰的工作在 tracker 建 decision map。随后通常每个 session 解决一个非研究票，研究票可由后台 Agent 并行推进；prototype、grilling 或必要 task 用于解除决策阻塞，人工决定需要真实交流。默认产出决策，再由用户带入 to-spec；正文允许 Notes 明确覆盖规划默认，但不把地图直接当工程交付 backlog。
    language: zh-Hans
    source_fingerprint: sha256:12dc434e7d07e61f4f91e945859f08a45c9b79f61bea2c929c187b39827528fe
    review_status: reviewed
    reviewed_at: 2026-10-13
