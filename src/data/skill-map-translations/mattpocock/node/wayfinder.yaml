  - path: official_description
    translation: Plan a huge chunk of work (more than one agent session can hold) as a shared map of decision tickets on your issue tracker, and resolve them one at a time until the way to the destination is clear.
    language: en
    source_fingerprint: sha256:5255239b732dc81e28f27fe9eb0f1bf22b27800d93eae284eed30f7d7719d5da
    review_status: draft
  - path: mechanism
    translation: 用户显式启动后，针对太大且路线尚不清晰的工作在 tracker 建 decision map。随后通常每个 session 解决一个非研究票，研究票可由后台 Agent 并行推进；prototype、grilling 或必要 task 用于解除决策阻塞，人工决定需要真实交流。默认产出决策，再由用户带入 to-spec；正文允许 Notes 明确覆盖规划默认，但不把地图直接当工程交付 backlog。 决策图和票据只使用 wayfinder 类型标签。先建子票据，再写阻塞关系和实际引用。研究任务并行分配给使用新上下文的代理，研究分支不进入产品合并。
    language: zh-CN
    source_fingerprint: sha256:b50ac95ac316039c79533816174cae90ef55309e97a7a5bcad81c1048214c284
    review_status: draft
