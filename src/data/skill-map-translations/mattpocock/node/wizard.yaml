  - path: official_description
    translation: Generate an interactive bash wizard that walks a human through steps only they can perform. Use when provisioning infrastructure, setting up credentials or CI secrets, walking an unfamiliar third-party dashboard, or running a one-off migration or cutover. Don't invoke this for steps the agent can perform itself.
    language: en
    source_fingerprint: sha256:ba89b27b458951b895c6bc4b69f1a827c752471a7db928e6f9311a6228cdec13
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: mechanism
    translation: 遇到只有人能完成的认证、凭据、第三方 dashboard 或 cutover 步骤时，生成交互式 Bash 向导，把 URL、提示、采集值和配置写入步骤组织起来。Agent 只生成并静态验证脚本，将运行命令交给人；人执行时才采集值或写入配置。Agent 能自行完成的步骤不进入这个向导。
    language: zh-Hans
    source_fingerprint: sha256:3a20a03ab5cc6559ea0fdc351c5c6414b60fd4d8795a051f54ba09e3974fda48
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: when_to_use.0
    translation: Agent 遇到必须由人完成的认证、凭据或第三方 UI 操作。
