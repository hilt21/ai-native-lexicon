  - path: definition
    translation: 指令规定智能体应如何行动，包括约束、优先级和输出要求。它可以跨任务生效，也可以仅针对一个请求；描述性来源材料不会自动成为指令。
    source_fingerprint: sha256:8e876801b31cbe61662dc6a75d90520353e3d8db6debc32b2b7bd852a4a35194
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: why_it_matters
    translation: 明确规则使要求可复用，也帮助区分已授权行为与检索材料中的文字。
    source_fingerprint: sha256:9d4cd143e413b71eb5f2c50877bcc02ba4c9b5ba31272230983bc65665f433a2
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: when_to_use
    translation: 要求提供引用、限定编辑范围或制定团队审查要求时使用。
    source_fingerprint: sha256:c0e501a155f71ef947ae9c84a876e7ff62d1d16c675bc0749e5da056d7af27d6
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: anti_pattern
    translation: 把不可信文档中的命令当作已授权的操作规则。
