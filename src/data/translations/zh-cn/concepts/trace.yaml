    review_status: draft
  - path: why_it_matters
    translation: 相互关联的事件记录让故障定位更容易，也让最终结果能与产生它的操作相联系。
    source_fingerprint: sha256:641e543d2f02c5fcd0fe712211ef69750a1b37d2c0cd2de1031209ca687a62ec
    review_status: draft
  - path: when_to_use
    translation: 调查多步骤运行中哪次工具调用引入错误值时使用。
    source_fingerprint: sha256:c1421956a43d2d423b07e84b2d695bbc29ae8f2064f3a1d2ccdc2fb5115b8d8e
    review_status: draft
  - path: anti_pattern
    translation: 仅记录最终答案，并称其为完整执行追踪。
