  - path: why_it_matters
    translation: RAG 让应用能够使用可更新的知识来源，减少对模型参数中编码事实的单独依赖。
    source_fingerprint: sha256:38eafa9f9948b35d84b8459e7e8423297a5237d8f344028d726ca467407d6489
