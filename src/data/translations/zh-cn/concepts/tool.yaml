  - path: why_it_matters
    translation: 工具将生成的决策连接到模型文字响应之外的可观察信息和实际影响。
    source_fingerprint: sha256:c3cfffce20f898f4ef0287c51811499d7ba54ed45b1b94272f289f833bde9e02
