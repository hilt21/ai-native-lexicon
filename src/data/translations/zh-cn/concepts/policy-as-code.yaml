schema_version: 1.0.0
locale: zh-CN
kind: concept
target_id: policy-as-code
units:
  - path: summary
    translation: 将操作规则表达为具有版本、可测试且可强制执行的逻辑，减少对文字指令的单独依赖。
    source_fingerprint: sha256:5a5ea5fd0b3924933c2105eefe17570088ec3f73dcdcd3e7bc8cbb703710aa93
    review_status: draft
  - path: definition
    translation: 策略即代码将批准阈值、数据访问、行动限制和保留规则等要求，转换为约束智能体行为的确定性检查。自然语言指导可解释策略，但合规判断由可执行控制作出。
    source_fingerprint: sha256:9232bf3d6b844ec631c3c380fa06d9020f5f2458bbf205f19d79bf60a4e07417
    review_status: draft
  - path: why_it_matters
    translation: 具有版本的策略可被审阅、测试、审计和回滚，并减少不适合概率解释场景中的歧义。
    source_fingerprint: sha256:0fe4f89885c7096c8df5ec9d113bec30f1464e80ebdb4103615b6037cd4ae900
    review_status: draft
  - path: when_to_use
    translation: 规则用于保护资金、数据、基础设施、法律承诺或组织权限时使用。
    source_fingerprint: sha256:0292194aaf64459738a99c3f272da4479f715fc435c44d9537c8d29228342c80
    review_status: draft
  - path: anti_pattern
    translation: 在提示中重复分散的策略片段，最终无人能确定实际执行哪个版本。
    source_fingerprint: sha256:ce5e1b0df9b34ac482d81248fa837945e16b101f7fefed0ad9f4025e69a8fdfe
    review_status: draft
