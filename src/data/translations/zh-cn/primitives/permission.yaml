  - path: ownership.rationale
    translation: 身份验证、访问检查和运行时执行约束决定哪些操作可以继续。
    source_fingerprint: sha256:95061f1c6f61b61d1c120413f91c07a560fb145c670fbd2ffe64acd20e8ab6ce
