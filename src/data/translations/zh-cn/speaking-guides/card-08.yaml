  - path: ending
    translation: 随着 AI 获得行动能力，人的判断变得更加重要。
    source_fingerprint: sha256:42829920758b69b6439b8b150cd5602e9683c43a0109aaf9880617929e6a3fd3
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: keyLines
    translation:
      - 语言模型可以生成信息。
      - 工具让它能够与真实系统交互。
      - 它可以搜索、创建、更新或触发流程。
      - 每增加一个工具，能力就有所增长。
      - 每增加一个工具，责任与风险也有所增长。
    source_fingerprint: sha256:9c79d30340a2d88b59da31c72d9dd5df2f9568996df51f92a0e08523977fd4ff
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 一名员工向 AI 助手询问年假。
      - 回答政策问题是有用的。
      - 连接了工具的智能体还可以查询员工剩余假期、寻找可用日期并准备请假申请。
      - 体验从信息走向了行动。
    source_fingerprint: sha256:8e99e9cbf5760d60def22eb1c97aef9b702326c292e316e10f3acf53ffcf16cc
