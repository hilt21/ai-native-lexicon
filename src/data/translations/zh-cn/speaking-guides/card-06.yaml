  - path: keyLines
    translation:
      - 提示词有用，但只是系统的一部分。
      - AI 需要在正确的时间获得正确的信息。
      - 好的上下文可以包括文档、数据、指令和之前的操作。
      - 差的上下文会导致差的决策。
      - 上下文工程正在成为一项核心 AI 能力。
    source_fingerprint: sha256:62b3dc7ace64687a0eb55cf774e6ff4dd06d1d9b7a11a4752234d2f9d0f66d1f
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 假设你让 AI 编写项目状态报告。
      - 巧妙的提示词可能改善文笔。
      - 但如果 AI 不知道当前计划安排、未解决问题、已有决策和最新变化，报告仍然薄弱。
      - 答案质量很大程度上取决于上下文质量。
    source_fingerprint: sha256:4d2a795fd20429cbc05c24eafe70e07a8956784df77e82ccead8eb4eda71d7e5
    review_status: reviewed
    reviewed_at: 2026-10-13
