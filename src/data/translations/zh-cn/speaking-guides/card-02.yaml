  - path: ending
    translation: 如果智能体可以承担工作责任，我们就需要了解究竟是什么让智能体成为可能。
    source_fingerprint: sha256:1e14e814b31ee5d28774693d6956cb5ef601b8b43fd3b30ce5a6aac9221d0f72
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: keyLines
    translation:
      - Copilot 通常与人协作。
      - 你提问，它回答，你仍控制每一步。
      - 智能体可以通过多个步骤朝目标推进。
      - 它可以使用工具、做出决策并采取行动。
      - 关键区别是委派的程度。
    source_fingerprint: sha256:84ed37e796d0042d180d92444ef1b87e42ce52f3d99f9396f4fa058780576da6
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 假设你要准备每周项目报告。
      - Copilot 可以在你提出请求时总结文档。
      - 智能体则可以收集最新项目信息、识别重要变化、准备报告，并发送给你审查。
      - 关键转变是从向 AI 提出单个问题，到给 AI 一个目标。
    source_fingerprint: sha256:bb9314a42fc25c73ec210d5771a46e0a7f4d32d6d4c95bb3306e7de055f52268
    review_status: reviewed
