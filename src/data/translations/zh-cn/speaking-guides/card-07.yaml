  - path: ending
    translation: 知识帮助 AI 理解情况，工具则让 AI 能够采取行动。
    source_fingerprint: sha256:7671ae9edcf026b9a43252fa53c65f5847f4e270f7bdc2fbb4b2ad1b3a3b8a54
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: keyLines
    translation:
      - 公司已经拥有大量知识。
      - 问题是这些知识往往分散。
      - 它们存在于文档、邮件、数据库和人的经验中。
      - AI 可以帮助关联这些来源。
      - 但知识仍必须准确、可访问，并受到治理。
    source_fingerprint: sha256:654236fb74494111c9f4c839abb22367de531dcaab082cab50343c3882c8967d
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 设想一位新工程师加入项目。
      - 重要信息可能分散在 SharePoint、旧报告、会议记录、邮件以及资深工程师的经验中。
      - AI 助手可以帮助关联这些来源，并在回答问题时提供相关参考。
      - 这可以缩短理解项目所需的时间。
    source_fingerprint: sha256:bd4693eed08c4fd5c8b8506bf1b624c655464c8a55e17836e52571c9f04bbde6
    review_status: reviewed
