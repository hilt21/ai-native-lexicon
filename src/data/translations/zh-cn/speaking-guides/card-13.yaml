  - path: ending
    translation: 找到一项合适的任务之后，下一个机会往往是看看这项任务之外的流程。
    source_fingerprint: sha256:66ff1b7fd250d4a0c62051bf6ca0c92b62df57b1ca407e59e39fabb030c46a12
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: keyLines
    translation:
      - 先寻找浪费时间和重复劳动的地方。
      - 关注搜索、阅读、比较和总结。
      - 关注交接和等待时间。
      - 关注依赖分散信息的工作。
      - 然后判断 AI 能否消除其中一部分阻力。
    source_fingerprint: sha256:1adf8a260aa0a4bd563356552a190ab89b3214cb1b24e649b4428d88e30e6d88
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 项目经理每周花数小时收集不同团队的更新。
      - 信息已经存在，但分散在邮件、文档和系统中。
      - AI 可以收集信息、识别变化并准备初步总结。
      - 这是一个有力的用例，因为痛点已经存在。
    source_fingerprint: sha256:7b1b143800c8370af030f5d0ac1672e94c8131a98d16eded0dcdef2c696d6254
