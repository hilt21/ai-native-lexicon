    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 假设供应商通过邮件发送一项异常技术请求。
      - 智能体阅读消息、理解请求并识别所需流程。
      - Power Automate 启动正确的工作流。
      - Dataverse 存储该事项。
      - Power App 让工程师能够审查它。
      - 智能体处理模糊性，平台则提供结构。
    source_fingerprint: sha256:9deec725d5822adab37b4ebac41702a4bfba4a696f7129e2293eb614e1210841
