  - path: keyLines
    translation:
      - 智能体善于理解复杂混乱的情况。
      - 工作流善于执行已定义的流程。
      - 应用提供结构化的人机交互。
      - 数据平台提供共享的业务状态。
      - 结合这些能力，可以构建更强的企业方案。
    source_fingerprint: sha256:2abea5c448e15f7f4c3f0ce477de9d5c96a40c45b890118c1aa302fad1a61721
