  - path: discussionQuestion
    translation: 即使 AI 变得更强，你的工作中哪些部分仍需要结构化界面？
    source_fingerprint: sha256:c09edd3e07b93ade26f7f4cb216fb6787e58e9ca2c60395e13f170a9fb877a52
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: endingLabel
