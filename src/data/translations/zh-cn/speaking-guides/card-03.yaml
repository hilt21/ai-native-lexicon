  - path: keyLines
    translation:
      - 模型为智能体提供智能。
      - 上下文告诉智能体正在发生什么。
      - 工具让智能体能够与外部世界交互。
      - 记忆帮助它长期保留有用信息。
      - 护栏规定智能体允许做什么。
    source_fingerprint: sha256:b724833d70c19a1d10ffda3c98f131ed0fc20af35e550973c7c9b0ce0389dc15
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 假设有一个帮助处理客户请求的智能体。
      - 语言模型可以理解请求。
      - 上下文为它提供客户和产品信息。
      - 工具让它可以搜索数据库或创建工单。
      - 记忆可以保留之前的交互。
      - 护栏可以要求某些操作先获得人工批准。
      - 这些部分共同将语言模型变为一个可工作的系统。
    source_fingerprint: sha256:571410513b8bedea57026215be69ca18b499ed6ccc839cd1b6e7e0f5f4b56f03
    review_status: reviewed
    reviewed_at: 2026-10-13
