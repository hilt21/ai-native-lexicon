  - path: coreIdea
    translation: 智能体将智能与上下文、工具、记忆和边界结合起来。
    source_fingerprint: sha256:7b73a8c9d7a9756e01a875eb0e777213f4bca9ad9a275daf3cdf066767ee9fe7
