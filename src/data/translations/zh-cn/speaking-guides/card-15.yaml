  - path: keyLines
    translation:
      - 大多数员工每天已经在使用 Microsoft 365。
      - Copilot 将 AI 带入 Word、Excel、PowerPoint、Outlook 和 Teams。
      - 这减少了在工具之间切换的需要。
      - 真正的优势是能够获取工作上下文。
      - AI 出现在熟悉的工作流中时，更容易被采用。
    source_fingerprint: sha256:1de8a1707948819a872e94304a394377aeb2f172a81125d4159a4674f975639a
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 长时间的项目会议结束后，员工可能需要查看记录、识别决策并准备后续行动。
      - Copilot 可以帮助总结会议，并准备后续工作的初稿。
      - 用户仍在同一个工作环境中。
    source_fingerprint: sha256:301d66c6b8a1230eb5d36671dd9ba92ee7c8b5968c5f651be594039f0783769f
