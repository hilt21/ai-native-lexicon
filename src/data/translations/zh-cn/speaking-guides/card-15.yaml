  - path: ending
    translation: 个人生产力是其中一层。公司还需要为特定业务目的设计的智能体。
    source_fingerprint: sha256:e1d2cb83b189ce2b883f455c7f0c0aeb6bd4fa451cf3ae4841d0d97be293094a
