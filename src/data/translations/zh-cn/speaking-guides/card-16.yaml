  - path: discussionQuestion
    translation: 如果团队可以构建一个专用智能体，你会给它什么工作？
    source_fingerprint: sha256:0c44eb819e696058db1db3a1743156b4c8bc5aeb7a25e84d6abbe93cefb2e91f
