  - path: ending
    translation: 智能体背后的许多操作仍需要可预测地执行。这正是 Power Automate 的适用之处。
    source_fingerprint: sha256:3976de41d076b8ddecbc72f4fe6b1166f6f68220adbc41cee758212b94ea09d2
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: keyLines
    translation:
      - 通用 AI 无法知道每一种业务流程。
      - 为特定目的构建的智能体可以结合指令、知识和工具。
      - 它们可以将 AI 与企业系统连接起来。
      - 它们也可以包含业务规则和批准步骤。
      - 这让智能体更切合特定团队的需要。
    source_fingerprint: sha256:df2c01353104dea2f762754ac7620e174d34ec00e7b52f31a46563fda93475e1
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 假设有一个内部工程支持智能体。
      - 它理解工程指南、搜索已获批准的文档、回答常见问题，并将特殊情况引导给合适的专家。
      - 这个智能体具有明确的业务目的和受控的知识范围。
    source_fingerprint: sha256:fa4f4ffbff6ccd1ca2919a1c5b2fccf2313aae28d5999bd83ab17611af490384
    review_status: reviewed
