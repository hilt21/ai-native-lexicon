  - path: ending
    translation: 证据帮助我们理解智能体做了什么，权限则决定它允许做什么。
    source_fingerprint: sha256:815edc39ee612a226f05cb59eaab170cbae62a6c690de286fc42319f5689b944
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: keyLines
    translation:
      - 信心不等于正确。
      - 人们需要了解重要信息来自哪里。
      - 好的系统提供来源、日志和可追溯性。
      - 证据让人能够核验 AI 输出。
      - 系统让核验更容易时，信任就会增长。
    source_fingerprint: sha256:c753ee25b2a511a877d838dc1aeb44e795a36f7d8b48277a7ef2ac6b535cd471
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 假设 AI 告诉工程师某个组件符合技术要求。
      - 只有这句话是不够的。
      - 工程师想知道：是哪项要求、哪份文档、哪个修订版本以及哪项测试结果支持这个结论。
      - 证据让 AI 答案变为可以审查的内容。
    source_fingerprint: sha256:a09dc6a86f188aa94c7e318b0a66a6c3a54cdbd88f31c81a6925317ea0a6ff04
    review_status: reviewed
    reviewed_at: 2026-10-13
