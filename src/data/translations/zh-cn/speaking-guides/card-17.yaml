  - path: keyLines
    translation:
      - 许多业务流程遵循明确规则。
      - 这些流程不一定需要 AI 推理。
      - Power Automate 可以连接系统并执行已定义的步骤。
      - 它尤其适合批准、通知和数据流转。
      - 智能体与自动化可以协同工作。
    source_fingerprint: sha256:a4f072d73e2fc37f1f4e4de6f6bcdf386051b2778f8ab3c07108f939424418ac
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 智能体收到客户请求，并判断需要经理批准。
      - 智能体不必自行设计批准流程。
      - Power Automate 可以启动预定义的批准流程、收集决定并返回结果。
      - 推理与执行承担不同角色。
    source_fingerprint: sha256:98f9873652f8169662e689aa86c6274005e75c6290c22a5a0741414ab877cec1
