  - path: keyLines
    translation:
      - 许多人从单个 AI 任务开始。
      - 这是有用的第一步。
      - 连接多个步骤后，更大的价值就会出现。
      - 我们应关注信息和决策的完整流转。
      - AI 给了我们重新思考工作组织方式的理由。
    source_fingerprint: sha256:4110ae74da2aebba278a0253b5ab6d5ed1f5b507b265e2b7a404923584945492
    review_status: reviewed
    reviewed_at: 2026-10-13
  - path: realCase
    translation:
      - 假设要编写测试报告。
      - 最初，AI 帮助写一个段落。
      - 之后，这个流程可以扩展。
      - AI 查找以前的报告、提取产品信息、识别相关标准、生成初稿并准备待审查文档。
      - 价值来自连接完整的工作流。
    source_fingerprint: sha256:45ff595a17994397e8ad5553c21c71a5c00730ad18285bbf996f270fb07ec035
