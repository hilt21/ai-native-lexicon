title: to-tickets
summary: 把计划或规格拆成带阻塞关系的 tracer-bullet tickets。
type: workflow
status: active
layer: workflow
primary_cluster: spec-planning
secondary_clusters:
  - implementation-feedback
tags:
  - engineering
  - user-invoked
  - stable
mechanism: 用户显式启动后，读取完整 plan/spec/讨论与代码，把工作拆成每票在一个新 context 内可完成、能独立演示或验证的完整 vertical tracer bullet；需要的 prefactor 先做，无法逐片保持有效的宽机械重构采用 expand–migrate–contract 例外。向用户确认 granularity、合并/拆分与 blocking edges 后发布；本地一票一文件，真实 tracker 使用相应阻塞关系，不关闭或修改父票。产生的票据已 agent-ready，无需再 triage。
when_to_use:
  - 已有 plan/spec，需要变成可执行 backlog。
  - 希望多个 Agent 能安全并行实现一个较大规格。
solves:
  - 避免大任务一次性塞进单个 context window。
  - 把实施顺序和并行机会显式化。
inputs:
  - plan/spec/conversation
  - issue tracker 配置
outputs:
  - agent-ready tickets
  - blocking graph
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/to-tickets/SKILL.md
handoffs: []
official_description: Break a plan, spec, or the current conversation into a set of tracer-bullet tickets, each declaring its blocking edges, published to the configured tracker (edges as text in one file per ticket locally, or native blocking links on a real tracker).
