title: migrate-to-shoehorn
summary: 把测试中的 `as` 类型断言迁移到 @total-typescript/shoehorn。
type: discipline
status: active
layer: discipline
primary_cluster: implementation-feedback
secondary_clusters: []
tags:
  - misc
  - model-invoked
  - stable
mechanism: 仅迁移测试文件中作为数据构造的类型断言：fromPartial 表达部分有效数据，fromExact 表达完整对象，fromAny 用于有意构造的非法值。安装所需依赖并类型检查；故意无效的测试值不会因工具转换而变成正确数据。
when_to_use:
  - 测试代码大量使用 `as` 构造不完整数据。
  - 项目希望采用 @total-typescript/shoehorn。
solves:
  - 降低测试中的不安全类型断言。
inputs:
  - 测试文件
  - 现有 `as` assertions
outputs:
  - 使用 shoehorn 的测试数据构造
