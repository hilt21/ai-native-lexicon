title: prototype
summary: 用一次性代码回答纸面讨论难以解决的设计问题。
type: discipline
status: active
layer: discipline
primary_cluster: debugging-research
secondary_clusters:
  - alignment-domain
tags:
  - engineering
  - model-invoked
  - stable
mechanism: 围绕一个设计问题快速写出标为 throwaway 的原型，代码放在相关模块或页面附近。逻辑问题用可分享的单文件 HTML，UI 问题在同一路由展示明显不同的方案；默认无持久化，显式显示状态。验证后把结论带回真实工作，把原型提交到 main 之外的临时分支，并在实施 issue 留下问题、结论和分支指针。跨目录或 harness 的探索可经 handoff 往返。
when_to_use:
  - 状态模型或业务逻辑需要实际运行才能判断。
  - UI 方向需要看见并比较多个方案。
solves:
  - 减少纯讨论导致的设计猜测。
  - 用廉价实验替代昂贵的生产实现试错。
inputs:
  - 设计问题
  - 必要的最小上下文
outputs:
  - 可运行的 throwaway 原型
  - 设计问题与验证结论
  - 原型分支与实施 issue 的来源指针
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/prototype/SKILL.md
handoffs: []
official_description: Build a throwaway prototype to answer a design question. Use when the user wants to sanity-check whether a state model or logic feels right, or explore what a UI should look like.
