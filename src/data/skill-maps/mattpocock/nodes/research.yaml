mechanism: 优先读取 primary sources，在后台完成阅读与比较，把结论、引用和不确定性整理成 Markdown artifact，供主工作流继续使用。
when_to_use:
  - 需要 API、标准、框架或外部技术事实。
  - 不希望阅读任务占满主 session。
solves:
  - 减少主 context 中的大量阅读负担。
  - 让研究结果成为后续设计可引用的 durable artifact。
inputs:
  - research question
  - 可用 primary sources
outputs:
  - cited Markdown research note
