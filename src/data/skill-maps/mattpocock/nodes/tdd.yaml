title: tdd
summary: 在已确认的公共 seam 上以 red→green 小片实现行为，重构在审查阶段处理。
type: discipline
status: active
layer: discipline
primary_cluster: implementation-feedback
secondary_clusters:
  - debugging-research
  - architecture-quality
tags:
  - engineering
  - model-invoked
  - stable
mechanism: 只在用户事先确认的公共 seam 上，以一个 vertical slice 为单位先写失败测试，再做最小实现使测试通过（red→green），预期来自需求或独立事实。重构不属于实现循环，而在 code-review 审查阶段处理。单独使用时也需先约定 seam。
when_to_use:
  - 开发可以通过自动测试表达的行为。
  - 修复可以形成 regression test 的缺陷。
solves:
  - Agent 修改代码后缺少快速反馈。
  - 大批修改后才发现实现方向错误。
inputs:
  - 目标行为与独立预期
  - 用户已确认的公共测试 seam
  - 可运行测试环境
outputs:
  - failing test
  - passing implementation
  - regression protection
