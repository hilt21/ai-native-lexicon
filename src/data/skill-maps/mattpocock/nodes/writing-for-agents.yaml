title: writing-for-agents
summary: 为 Agent 编写它实际会消费的 steering 与 reference 文档。
type: discipline
status: active
layer: discipline
primary_cluster: communication-tooling
secondary_clusters:
  - architecture-quality
tags:
  - productivity
  - model-invoked
  - stable
mechanism: 为 skills、AGENTS.md、CLAUDE.md 与 pointer docs 提供写作参考：同时考虑 Agent context 与人的阅读成本，给出完成条件、渐进披露和就近指针，删除 no-op 与无用规则。输出是当前文档任务中的指导或编辑结果，不自动生成所有文档；创建真正 skill 时另读取其机制说明。
when_to_use:
  - 创建或修改 skill。
  - 编写 AGENTS.md、CLAUDE.md 或其它 Agent-facing docs。
solves:
  - 减少 Agent context 中的噪声。
  - 让规则和参考资料更容易被正确找到与执行。
inputs:
  - Agent-facing 文档目标
  - 现有项目结构
outputs:
  - 更适合 Agent 消费的文档
