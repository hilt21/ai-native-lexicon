title: domain-modeling
summary: 持续建立项目的统一领域语言和关键决策记录。
type: discipline
status: active
layer: discipline
primary_cluster: alignment-domain
secondary_clusters:
  - architecture-quality
tags:
  - engineering
  - model-invoked
  - stable
mechanism: 挑战模糊或重载的领域术语，用 edge cases 检验含义，随时把稳定词汇写入 GLOSSARY.md。只有难以逆转、缺少背景会令人意外且存在实质 tradeoff 的决定才建议记成 ADR；不把实现细节塞进 glossary，也不把每个稳定认识都写成 ADR。
when_to_use:
  - 项目术语不一致或同一个词承担多个含义。
  - 需要修改 GLOSSARY.md 或记录 ADR。
solves:
  - 降低人与 Agent 的语言歧义。
  - 让命名、导航和后续推理共享同一领域模型。
inputs:
  - 领域术语
  - 代码和业务上下文
outputs:
  - 更新后的 GLOSSARY.md
  - 满足记录条件时的 ADR
