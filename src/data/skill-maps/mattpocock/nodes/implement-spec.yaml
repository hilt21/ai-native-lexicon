title: implement-spec
summary: 在一个 integration branch 上并行实现完整 spec。
type: workflow
status: active
layer: workflow
primary_cluster: implementation-feedback
secondary_clusters:
  - spec-planning
  - architecture-quality
tags:
  - engineering
  - user-invoked
  - stable
mechanism: 用户显式启动整个 spec 的实施。把票据及 blocking edges 读作 task graph，先建立 integration branch，在 ready frontier 上委派 implementer subagents，各自在 worktree 内用已约定 seam 的 TDD 实现并提交，同步 integration tip 后由编排者合并；所有票据完成后统一 code-review。它与逐票 implement 是选择关系，不是先后必经阶段。
when_to_use:
  - 已有完整 spec 与 tickets，并希望一次 orchestration 完成。
  - 多个独立 ticket 可并行推进。
solves:
  - 提高大型 spec 的并行吞吐。
  - 在并行实现时保持任务依赖、集成顺序和最终 review。
inputs:
  - spec
  - ticket graph
  - issue tracker 配置
outputs:
  - integration branch
  - resolved tickets
  - final code review
  - ready PR 或 branch
