title: teach
summary: Teach a skill or concept over multiple sessions in the current workspace.
type: workflow
layer: workflow
primary_cluster: communication-tooling
secondary_clusters:
  - alignment-domain
tags:
  - productivity
  - user-invoked
  - stable
inputs:
  - Learning mission
  - Trusted resources
  - Current learning record and workspace
outputs:
  - Cited interactive HTML lessons and reference HTML
  - Learning records and assets that persist across sessions
handoffs: []
source_refs:
  - source: mattpocock-skills-1-3-2-5863806d
    path: productivity/teach/SKILL.md
official_description: Teach the user a new skill or concept, within this workspace.
status: active
mechanism: After explicit user invocation, agree the learning goal and trusted sources. Keep learning state in the invocation directory and resolve format references from the skill directory. Use short cited interactive HTML lessons, reference material and repeated practice. Keep quiz answers at the same word count and, if possible, character count; vary where the correct answer appears. Confirm changes to the learning goal.
when_to_use:
  - Learn a topic over time rather than receive one explanation.
solves:
  - Preserve learning progress across sessions.
  - Turn teaching into a continuing learning process.
