title: handoff
summary: 把当前会话压缩成另一个 Agent 或 session 可以继续的 portable handoff。
type: workflow
status: active
layer: workflow
primary_cluster: delivery-human-loop
secondary_clusters:
  - communication-tooling
tags:
  - productivity
  - user-invoked
  - stable
mechanism: 把目标、已做决策、当前状态、证据、所用技能及关键文件指针写成操作系统临时目录中的独立 Markdown。适用于新 harness、新目录、交给同事或在阶段中分出侧任务；普通阶段边界先判断是否继续、清空上下文、委派或压缩，并非每次都要 handoff。
when_to_use:
  - 需要新 harness、新目录或将上下文交给同事。
  - 需要在阶段中分出侧任务，并把 portable context 带给接手者。
solves:
  - 降低跨 session 上下文重建成本。
  - 避免关键决定只存在聊天历史中。
inputs:
  - 当前 conversation
  - 目标用途
outputs:
  - handoff Markdown
