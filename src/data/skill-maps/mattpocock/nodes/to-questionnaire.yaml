title: to-questionnaire
summary: 把只有外部利益相关者能回答的决策缺口转换成 questionnaire。
type: workflow
status: active
layer: workflow
primary_cluster: delivery-human-loop
secondary_clusters:
  - spec-planning
tags:
  - productivity
  - user-invoked
  - stable
mechanism: 用户显式启动后，先用两轮交流明确收件人的角色、背景与要拿回的结果，再围绕真正信息缺口生成当前目录的 to-questionnaire-<slug>.md；按主题优先级组织问题和回答空位。技能只写问卷，由读者分发并把收到的回答带回原讨论。
when_to_use:
  - 当前工作被另一个人的知识或决定阻塞。
  - 需要会前或异步收集结构化输入。
solves:
  - 减少来回追问利益相关者的同步成本。
  - 让外部输入直接成为后续 spec 或设计材料。
inputs:
  - 决策缺口
  - 受访者
  - 需要的输出
outputs:
  - 当前目录中带回答空位的 Markdown questionnaire
source_refs:
