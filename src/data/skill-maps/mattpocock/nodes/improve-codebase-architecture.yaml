title: improve-codebase-architecture
summary: Survey the codebase for opportunities to make modules deeper and easier to maintain.
type: workflow
layer: workflow
primary_cluster: architecture-quality
secondary_clusters:
  - alignment-domain
tags:
  - engineering
  - user-invoked
  - stable
inputs:
  - Codebase
  - Existing modules and interfaces
outputs:
  - Architecture opportunity list
  - Visual HTML report
  - Design questions for the selected candidate
handoffs: []
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/improve-codebase-architecture/SKILL.md
official_description: Scan a codebase for deepening opportunities, present them as a visual HTML report, then grill through whichever one you pick.
status: active
mechanism: After explicit user invocation, read codebase-design and delegate a survey informed by the repository, history and hotspots. Find opportunities to hide more complexity and apply the deletion test. Produce a temporary HTML candidate report, wait for the user to select a direction, then investigate its design with grilling and domain-modeling. The survey does not automatically edit source or implement every candidate.
when_to_use:
  - Proactively improve the codebase before architectural problems become bugs.
  - Find high-value candidates for the next refactor.
solves:
  - Limit software entropy from accelerated agent coding.
  - Turn vague architecture concerns into comparable candidates.
