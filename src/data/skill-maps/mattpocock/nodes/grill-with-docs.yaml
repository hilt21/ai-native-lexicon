title: grill-with-docs
summary: 通过持续追问澄清设计，同时沉淀领域词汇和 ADR。
type: workflow
status: active
layer: workflow
primary_cluster: alignment-domain
secondary_clusters:
  - spec-planning
tags:
  - engineering
  - user-invoked
  - stable
mechanism: 内部调用 grilling 和 domain-modeling，在同一对话中暴露未决分支、统一术语，并在术语解决时写入 GLOSSARY.md。满足难逆转、意外性及 tradeoff 条件时才写 ADR；frontier 收敛后由用户确认共同理解，再继续工作。
when_to_use:
  - 在仓库中启动一个新 feature、设计或重要变更。
  - 需求看似清楚但仍包含大量隐含选择。
solves:
  - 减少人与 Agent 的需求错位。
  - 把对话中的领域知识沉淀成后续 session 可复用的项目上下文。
inputs:
  - 初始想法或设计
  - 当前仓库上下文
outputs:
  - 澄清后的设计
  - GLOSSARY.md 更新
  - ADR 更新
