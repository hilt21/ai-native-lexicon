title: wait-what
summary: Re-explain a misunderstood message using missing context and shared vocabulary.
type: workflow
layer: workflow
primary_cluster: communication-tooling
secondary_clusters:
  - alignment-domain
tags:
  - productivity
  - user-invoked
  - stable
inputs:
  - Previous message
  - Project glossary, if present
outputs:
  - Rephrased explanation
handoffs: []
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: productivity/wait-what/SKILL.md
official_description: "Stop. That last message did not land: re-pitch it."
status: active
mechanism: When the user says the previous message was unclear, identify missing prerequisites and re-explain with shared GLOSSARY.md vocabulary and plainer language. Pause forward progress. The fixed source calls for ASD-STE100 Simplified Technical English as a writing direction; that instruction does not establish verified STE compliance.
when_to_use:
  - The user explicitly says the last explanation was unclear.
solves:
  - Prevent misunderstanding from accumulating.
  - Reduce terminology burden in technical communication.
