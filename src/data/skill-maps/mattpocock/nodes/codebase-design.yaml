title: codebase-design
summary: Use deep-module vocabulary to design smaller interfaces, deeper implementations and clearer seams.
type: discipline
layer: discipline
primary_cluster: architecture-quality
secondary_clusters: []
tags:
  - engineering
  - model-invoked
  - stable
inputs:
  - Existing module structure
  - Target behavior
outputs:
  - Shared vocabulary for modules, interfaces, depth, seams, adapters and locality
  - Interface alternatives and decision principles where needed
handoffs: []
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/codebase-design/SKILL.md
official_description: Shared vocabulary for designing deep modules. Use when the user wants to design or improve a module's interface, find deepening opportunities, decide where a seam goes, make code more testable or AI-navigable, or when another skill needs the deep-module vocabulary.
status: active
mechanism: Assess boundaries through modules, interfaces, depth, seams, adapters, leverage and locality. Look for designs that support more behavior through a simpler interface.
when_to_use:
  - Design or refactor module interfaces.
  - Decide where a seam belongs or improve testability and agent navigation.
solves:
  - Reduce shallow modules and chains of forwarding wrappers.
  - Reduce the number of interfaces readers and agents must cross to understand the system.
