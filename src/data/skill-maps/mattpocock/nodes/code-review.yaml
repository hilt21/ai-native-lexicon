title: code-review
summary: Review a bounded diff independently against Standards and Spec.
type: discipline
layer: discipline
primary_cluster: architecture-quality
secondary_clusters:
  - implementation-feedback
tags:
  - engineering
  - model-invoked
  - stable
inputs:
  - fixed point
  - diff
  - repo standards
  - originating spec/issue
outputs:
  - Standards findings and result
  - Spec findings and result
handoffs: []
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/code-review/SKILL.md
official_description: "Review the changes since a fixed point (commit, branch, tag, or merge-base) along two axes: Standards (does the code follow this repo's documented coding standards?) and Spec (does the code match what the originating issue/spec asked for?). Runs both reviews in parallel sub-agents and reports them side by side. Use when the user wants to review a branch, a PR, work-in-progress changes, or asks to \"review since X\"."
status: active
mechanism: Compute the diff from the supplied fixed point. Two independent reviewers assess repository standards and specification compliance, then report findings and results for each axis. Preserve separate verdicts rather than combining them. Address refactoring and standards constraints during review.
when_to_use:
  - A branch, PR or work in progress needs formal review.
  - Implementation is complete and needs checks against both repository standards and the originating specification.
solves:
  - Catch requirement drift alongside code-quality issues.
  - Reduce the context bias of a single reviewer.
