title: diagnosing-bugs
summary: Find and fix the root cause using short feedback that captures the actual symptom; protect the fix at the correct seam, or record the missing seam.
type: discipline
layer: discipline
primary_cluster: debugging-research
secondary_clusters:
  - implementation-feedback
tags:
  - engineering
  - model-invoked
  - stable
inputs:
  - bug symptom
  - Runnable system
outputs:
  - Repeatable feedback or a reproduction with a fixed high occurrence rate
  - Root-cause evidence and fix
  - Regression test at the correct seam, or an explicit missing-seam finding
handoffs: []
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/diagnosing-bugs/SKILL.md
official_description: Diagnosis loop for hard bugs and performance regressions. Use when the user says "diagnose"/"debug this", or reports something broken/throwing/failing/slow.
status: active
mechanism: First run a fast feedback command that captures the exact symptom and observe failure. For a flake, improve and fix its reproduction rate. Narrow the reproduction, list falsifiable hypotheses and instrument the system. Write a failing regression before fixing only when the correct seam represents actual calling patterns; otherwise record the missing seam. Recheck the original scenario, remove debug instrumentation and record the root cause. If no feedback surface is available, explain the attempts and access gap rather than guessing.
when_to_use:
  - Code reading alone cannot reliably diagnose the bug.
  - The issue is intermittent, a regression or performance-related.
solves:
  - Base root-cause conclusions on feedback that exposes the actual symptom.
  - Protect the fix at the correct seam or reveal the architecture's testability gap.
