taxonomy:
  types:
    - id: router
      label: Entry router
      description: Help the user choose the next work path.
    - id: workflow
      label: User workflow
      description: A skill that the user explicitly starts to coordinate a complete phase of work.
    - id: discipline
      label: Reusable discipline
      description: An engineering method or capability an agent may use when the task calls for it.
  layers:
    - id: entry
      label: Entry
      description: Configure the project and select an entry point.
    - id: workflow
      label: Workflow
      description: Organize complete work around the user's objective.
    - id: discipline
      label: Discipline
      description: Provide reusable engineering capabilities to workflows.
  clusters:
    - id: entry-routing
      label: Entry and routing
      description: Where should I start?
    - id: alignment-domain
      label: Alignment and domain understanding
      description: What problem are we solving, and do we share the same vocabulary?
    - id: spec-planning
      label: Specifications and planning
      description: How do we turn an idea into executable work?
    - id: implementation-feedback
      label: Implementation and feedback
      description: How do we deliver code through short feedback loops?
    - id: debugging-research
      label: Debugging and exploration
      description: How do we obtain evidence when the answer or root cause is unknown?
    - id: architecture-quality
      label: Architecture and code quality
      description: How do we keep the codebase understandable, testable and adaptable?
    - id: delivery-human-loop
      label: Delivery and human participation
      description: How do we complete PRs, handoffs and steps that a person must perform?
    - id: communication-tooling
      label: Communication and engineering tools
      description: How do we improve agent communication and the engineering environment?
  relation_types:
    - id: routes_to
      description: An entry recommends a skill suited to the task. The user decides whether to start it; the edge does not imply automatic invocation.
      outgoing_label: Recommend entry
      incoming_label: Recommended by
    - id: uses
      description: Actual use or an explicit reference to a reusable capability. A note bounds edges that share only design vocabulary; those do not imply runtime invocation.
      outgoing_label: Uses capability
      incoming_label: Used by workflows
    - id: feeds
      description: One phase's output can become another phase's input.
      outgoing_label: Can hand output to
      incoming_label: Can receive output from
    - id: configures
      description: A skill establishes project configuration on which other skills depend.
      outgoing_label: Configures
      incoming_label: Configured by
