schema_version: 1.1.0
title: Matt Pocock Skills Map
summary: Choose and combine Matt Pocock's engineering skills around a user goal, from clarification and planning to implementation, verification and retrospective.
scope: "Fixed mattpocock/skills 1.3.2 snapshot (5863806d): 31 entries outside in-progress, comprising 27 plugin-distributed skills and four misc utilities. Eight in-progress entries, including software-factory, are excluded. The teaching catalog and plugin distribution do not cover every entry. Classifications, relationships and seven task journeys are editorial guidance. This site does not install or invoke skills."
audience:
  - Developers using Matt Pocock skills for the first time
  - Engineers building reliable AI coding workflows
  - Agent users learning how skills fit together
