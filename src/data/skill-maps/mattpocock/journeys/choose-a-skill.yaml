title: 我不知道该用哪个 Skill
summary: 先用统一入口判断当前任务最适合哪条工作路径。
order: 1
when_to_use:
  - 面对一个任务，但不确定应该调用哪个 Matt Pocock skill。
inputs:
  - 当前目标与项目状态
outputs:
  - 推荐 skill 或工作路径
