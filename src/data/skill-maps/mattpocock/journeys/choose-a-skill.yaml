    steps:
      - title: 首次使用先完成配置
        why: 这些工程入口需要项目的 issue tracker、triage 标签与领域文档布局；已经配置的项目直接继续。
        nodes:
          - setup-matt-pocock-skills
        outputs:
          - 可供后续入口读取的项目配置
        optional: true
        when: 首次工程工作，或项目配置仍缺失。
      - title: 描述目标并获得推荐
        why: ask-matt 根据目标和当前阶段推荐入口后停止；用户决定是否显式启动推荐技能。
        nodes:
          - ask-matt
        outputs:
          - 推荐入口、理由和当前条件
