title: Clarify an idea
summary: Use structured questions to resolve implicit choices and record domain terms and ADRs when a repository exists.
order: 2
inputs:
  - Initial idea or design
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/ask-matt/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/grill-with-docs/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: productivity/grill-me/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/prototype/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: productivity/handoff/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/to-spec/SKILL.md
status: active
when_to_use:
  - Start a new feature, design or important plan without a sufficiently clear specification.
outputs:
  - Clarified design
  - Context ready to become a specification
variants:
  - id: in-repo
    title: Work in a working directory
    when: A repository is available to record vocabulary and decisions.
    steps:
      - title: Configure the project on first use
        why: Engineering entries require issue-tracker, triage-label and domain-document configuration; configured projects continue directly.
        nodes:
          - setup-matt-pocock-skills
        optional: true
        when: The first engineering task or missing project configuration.
        outputs:
          - Project configuration available to subsequent entries
      - title: Question the design and build shared language
        why: The user starts grill-with-docs, which uses grilling and domain-modeling internally. Stable terms and qualifying decisions enter GLOSSARY.md and ADRs.
        nodes:
          - grill-with-docs
        optional: false
        outputs:
          - Clarified design, shared vocabulary and necessary ADRs
      - title: Hand off an exploration question
        why: Use a portable handoff only when exploration requires a new directory, harness or side task.
        nodes:
          - handoff
        optional: true
        when: A key design question needs a runnable answer and a context change.
        outputs:
          - Markdown with the prototype question and context
      - title: Run a throwaway prototype
        why: prototype answers logic, state or visual questions through execution. Label it throwaway near the relevant module or page and retain branch/issue pointers.
        nodes:
          - prototype
        optional: true
        when: Discussion cannot yet resolve a key design question.
        outputs:
          - Runnable prototype, observations and design findings
      - title: Hand back findings when portability is needed
        why: Use handoff for a return across directories or harnesses, to a colleague or from a side task. Otherwise bring findings and pointers directly to the original discussion.
        nodes:
          - handoff
        optional: true
        when: Prototype findings exist and portability or a fork is actually required.
        outputs:
          - Portable findings with source pointers
      - title: Resume the original design discussion
        why: Reference prototype findings and retained branch/issue pointers in the original discussion. A prototype does not replace a specification, and ordinary return does not require another handoff.
        nodes:
          - grill-with-docs
        optional: true
        when: A prototype detour has findings and design clarification should continue.
        outputs:
          - Updated design
      - title: Synthesize the specification and confirm the test boundary
        why: Write the agreed decisions into a durable specification and agree the test seam with the user first.
        nodes:
          - to-spec
        optional: true
        when: Work will span sessions and no complete specification exists.
        outputs:
          - Published agent-ready specification and agreed seam
  - id: no-repo
    title: No working directory
    when: Think through a plan or design without a repository for domain documents.
    steps:
      - title: Clarify the design without persistent state
        why: The user starts grill-me, which uses the same grilling primitive without creating GLOSSARY.md or ADRs.
        nodes:
          - grill-me
        optional: false
        outputs:
          - Clarified decision tree
