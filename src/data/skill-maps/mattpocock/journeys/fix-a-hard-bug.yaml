  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/code-review/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/retro/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/improve-codebase-architecture/SKILL.md
variants:
  - id: standard
    title: 可观测复现驱动的修复
    steps:
      - title: 建立反馈并验证根因
        why: diagnosing-bugs 先要求一个已经能在此 bug 上变红的反馈入口（flake 为固定高复现率），再最小化、假设、instrument 和修复。有正确 seam 才先写回归测试，缺少时明确记录，最后重跑原始场景并清理。
        nodes:
          - diagnosing-bugs
        outputs:
          - 反馈入口、根因证据、修复及回归测试或缺少 seam 的记录
      - title: 按固定点审查修复
        why: 当需要独立审查时可使用 code-review，分别检查仓库标准和原问题要求；这是可选建议，并非诊断正文要求额外调用。
        nodes:
          - code-review
        outputs:
          - Standards 与 Spec 两轴发现
        optional: true
        when: 需要独立审查修复 diff。
      - title: 由用户选择是否复盘
        why: 复盘读取原始 session 记录并建议环境改进，候选由人选择；建议不自动应用。
        nodes:
          - retro
        outputs:
          - 按严重度排列的环境改进候选
        optional: true
        when: 用户希望总结这次工作的环境摩擦，尤其是实施不顺时。
      - title: 缺少反馈 seam 时调查架构
        why: 这是条件性的编辑建议，由用户启动架构 survey；不表示 diagnosing-bugs 自动调用或自动重构。
        nodes:
          - improve-codebase-architecture
        outputs:
          - 架构候选与待确认的模块边界
        optional: true
        when: 发现根本问题是缺少能观察和锁定行为的 seam。
