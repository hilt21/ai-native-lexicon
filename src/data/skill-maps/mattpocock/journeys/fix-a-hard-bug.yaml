title: 我遇到了一个难 Bug
summary: 先建立能捕获真实症状的红反馈，再最小化、假设、instrument 和修复；存在正确 seam 时留下回归测试，否则记录可测试性缺口。
order: 4
when_to_use:
  - bug 抗拒第一眼分析、存在 flake、回归或性能异常。
inputs:
  - bug symptom
  - 可运行系统
outputs:
  - 根因证据与修复
  - 正确 seam 上的回归保护，或记录缺少 seam 的发现
source_refs:
  - source: mattpocock-skills-1-3-1-dd400c3a
    path: engineering/ask-matt/SKILL.md
  - source: mattpocock-skills-1-3-1-dd400c3a
