title: orchestrate
summary: Coordinate a multi-day program with dozens or hundreds of agents through durable state.
type: playbook
layer: playbook
primary_cluster: parallel-autonomy
secondary_clusters: []
tags: []
inputs:
  - program goal
  - tracks
  - durable state store
outputs:
  - rolling verified units
  - program ledger/frontier
  - human report
handoffs: []
source_refs:
  - source: pstack-0-15-36-c742dd61
    path: skills/poteto-mode/playbooks/orchestrate.md
status: active
mechanism: The coordinator delegates through Task and tracks progress in the Project tracker and store. Use PR and CI event subscriptions when the harness supports them. Start with one complete unit, assign one writer per PR and require an independent verifier at the current head. The coordinator does not edit code, poll, relay worker messages or run the former orch scripts.
when_to_use:
  - Work exceeds one agent session.
  - multi-day program
  - Many subtasks and PRs
solves:
  - Coordinator context overload
  - Completion-interrupt storms
  - Shared-write conflicts
