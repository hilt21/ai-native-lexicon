official_description: Check a TLA+ model of a system that moves between states, such as a product flow, a protocol, or a service, and draw it as a Mermaid statechart. The report gives the shortest path to each state that breaks a rule. Use for /statechart, or to show a bug as a path through states.
status: active
mechanism: Check the TLA+ model with TLC and render the reachable states. Report shortest paths to reachable rule violations within the model and configuration.
