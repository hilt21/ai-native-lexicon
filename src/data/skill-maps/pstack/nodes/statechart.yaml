title: statechart
summary: Check a TLA+ state model and render its behavior as a Mermaid statechart.
type: capability
layer: skill
primary_cluster: verification-evidence
inputs:
  - TLA+ specification and configuration
outputs:
  - Mermaid statechart and counterexample report
when_to_use:
  - TLA+ specification and configuration
solves:
  - Check a TLA+ state model and render its behavior as a Mermaid statechart.
source_refs:
  - source: pstack-0-15-36-c742dd61
