title: architect
summary: Define types, interfaces, modules and data structures before writing code.
type: capability
layer: skill
primary_cluster: design-decision
secondary_clusters:
  - implementation-quality
tags:
  - architecture
  - design
inputs:
  - requirements
  - current architecture
  - constraints
outputs:
  - types/signatures
  - module map
  - design rationale
  - implementation constraints
handoffs: []
source_refs:
  - source: pstack-0-15-15-df581122
    path: skills/architect/SKILL.md
official_description: Sketch types, signatures, and module structure before code, then stay in the loop while implementation fills in. Use for /architect, 'architect this', 'design this', or non-trivial work where jumping to code would lock in the wrong shape.
status: active
mechanism: Ground the current system with how and why, explore alternative shapes with arena, choose an explainable target architecture and preserve its constraints during implementation.
when_to_use:
  - Changes span functions or modules.
  - Build a new feature.
  - Perform a nontrivial refactor.
  - Change a data model.
solves:
  - Avoid a local patch that entrenches the wrong structure.
  - Reduce rework and the effort required to understand the result.
