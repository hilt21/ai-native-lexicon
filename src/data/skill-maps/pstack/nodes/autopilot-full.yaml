title: autopilot-full
summary: One owner takes each PR from build to merge; the root performs independent verification, countersigning and audits.
type: playbook
layer: playbook
primary_cluster: parallel-autonomy
secondary_clusters: []
tags: []
inputs:
  - PR queue
  - operator gates
outputs:
  - merged verified PRs
  - decision/children trails
  - audit verdicts
handoffs: []
source_refs:
  - source: pstack-0-15-36-c742dd61
    path: skills/poteto-mode/playbooks/autopilot-full.md
status: active
mechanism: Use one owner per PR and a durable trail. Run self-proof, CI and babysit concurrently; the root verifies the exact head independently. After a clean verdict the owner merges. Audit or replace owners periodically. Honor explicit operator gates. Treat green CI as head-specific, reusing a verification lane only where the shipping patch rule allows it. Use ketchup to report live PR state and pending decisions.
when_to_use:
  - Automatically bring several independent PRs to merged state.
solves:
  - The root becomes an execution bottleneck.
  - PR owners lose lifecycle responsibility.
  - Independent countersigning is absent.
