official_description: 'Keep a reviewable decision trail for long-running or unattended
  work: a TSV log with one row per decision (what, why, evidence, result). Local by
  default; commit it when a reviewer needs the trail to trust the result. Use for
  /show-me-your-work, autonomous or multi-phase runs, or work a human reviews after
  stepping away.'
