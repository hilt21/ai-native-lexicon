official_description: Generate a project-local skill that formally verifies the code where a bug costs the most and tests reach the least, in any language, with whichever verification tool fits. Use for /create-formal-verification-skill, "model-check this race", "prove this invariant", or when concurrency, retries, state machines, parsers, or unsafe code need more than tests.
status: active
mechanism: Choose the tool from the property, tie the model to real code and demonstrate a failing broken variant. State the checked scope and leave reproducible verification instructions.
