title: create-formal-verification-skill
summary: Create a project-local skill for one high-cost property that tests seldom reach.
type: capability
layer: skill
primary_cluster: verification-evidence
inputs:
  - Critical invariant or concurrency behavior
outputs:
  - Project-local verification skill and reproducible evidence
when_to_use:
  - Critical invariant or concurrency behavior
solves:
  - Create a project-local skill for one high-cost property that tests seldom reach.
source_refs:
