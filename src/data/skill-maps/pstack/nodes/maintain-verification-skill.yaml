title: maintain-verification-skill
summary: Continuously calibrate the verification skill and Feature Map against code changes.
type: capability
layer: skill
primary_cluster: verification-evidence
secondary_clusters: []
tags:
  - verification
  - maintenance
  - drift
inputs:
  - verification skill
  - feature map
  - current source
  - live product
outputs:
  - clean/changed/blocked verdict
  - proven corrections
  - optional PR
handoffs:
  - "Handoff guidance: future verification runs"
source_refs:
  - source: pstack-0-15-15-df581122
    path: skills/maintain-verification-skill/SKILL.md
official_description: "Periodic pass that keeps a project's verification skill and feature map honest: parallel source readers per feature, one live session driving every feature, at most one PR of proven corrections. Use for /maintain-verification-skill or \"audit the verify skill\"."
status: active
mechanism: Read source for each feature in parallel, then drive all features through one live session. Distinguish documentation drift, harness gaps and product regressions.
when_to_use:
  - A verification skill exists while the product evolves.
  - Audit the verification skill periodically.
solves:
  - Prevent verifier decay.
  - Prevent incorrect documentation from hiding product regressions.
