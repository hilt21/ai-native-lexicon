title: interrogate
summary: Use multiple models for adversarial code or design review.
type: capability
layer: skill
primary_cluster: design-decision
secondary_clusters: []
tags:
  - review
  - adversarial
  - multi-model
inputs:
  - intent
  - diff or design
  - review context
outputs:
  - adversarial findings
  - triaged verdict
  - action items
handoffs:
  - "Handoff guidance: fix round"
source_refs:
  - source: pstack-0-15-36-c742dd61
    path: skills/interrogate/SKILL.md
official_description: Use for "interrogate", "adversarial review", "multi-model review", "challenge this", "stress test this code", "find blind spots", or "tear this apart". Adversaries try to break a change or design, and only findings proven by a run survive.
status: active
mechanism: Restate the user’s intent, frame the review scope and have independent adversaries challenge the design or diff. Keep only findings that can be demonstrated by a run. Report the evidence without applying fixes.
when_to_use:
  - Complex diff
  - Contested design
  - Find blind spots before shipping.
solves:
  - Reduce single-model confirmation bias.
  - Expose hidden risk early.
