official_description: Use for "automate me", "create/update/refresh my -mode skill",
  "turn/capture my preferences or working style into a skill", or wanting agents to
  follow how the user works. Drafts or revises a personal -mode skill via create-skill
  + unslop, optionally pulling fresh evidence from recent transcripts.
