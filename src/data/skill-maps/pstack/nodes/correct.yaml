mechanism: 识别重复 mistake class，按 architecture → types → lint/CI → test → docs 的强度顺序寻找
  remedy，并用真实历史错误证明 guard 会失败。
when_to_use:
- 同类 Agent 错误出现两次以上
- 用户反复纠正同一个问题
solves:
- 减少重复监督
- 把知识从 prompt 下沉到结构
inputs:
- corrections
- failure examples
- repository structure
outputs:
- structural guard
- proof against past mistake
- reduced future correction load
source_refs:
