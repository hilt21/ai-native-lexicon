official_description: Use for "how does X work", code walkthroughs before changing something, and placement / ownership / layering questions ("where should this live", "which package owns this", "is this the right layer"). Explains subsystem architecture, runtime flow, onboarding mental models. Use why for motivation.
status: active
mechanism: Analyze simple questions directly. For a complex system, investigate critical paths, ownership, runtime flow and layers in parallel, then synthesize a structured explanation.
when_to_use:
  - Understand a subsystem before changing it.
  - Walk through code.
  - Determine where code belongs in the system's layers.
solves:
  - Avoid changes made without understanding.
  - Reduce incorrect ownership and boundary decisions.
