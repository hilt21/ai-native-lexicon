mechanism: 可逆工作先做，只有不可逆或无法实验解决的偏好才阻塞人。
when_to_use:
- Apply when tempted to ask "should I do X?" on reversible work. Proceed, present
  the result, let the human course-correct after the fact; reserve confirmation for
  irreversible actions.
