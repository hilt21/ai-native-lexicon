title: autopilot-stack
summary: Automatically build and verify a linear PR stack, leaving final landing to the operator.
type: playbook
layer: playbook
primary_cluster: parallel-autonomy
secondary_clusters: []
tags: []
inputs:
  - PR queue
  - target stack order
outputs:
  - verified linear stack
  - stack-ready SHAs
  - operator handoff
handoffs: []
source_refs:
  - source: pstack-0-15-36-c742dd61
    path: skills/poteto-mode/playbooks/autopilot-stack.md
status: active
mechanism: Follow Autopilot-full up to verified and green on each current head. Stack a PR only if it depends on another PR. Hand off the verified PRs without merging; no pushes after handoff without operator approval.
when_to_use:
  - Automatically build several related PRs.
  - Keep final review and landing with a person.
solves:
  - Several owners mutate stack topology concurrently.
  - Automatic merge crosses the operator gate.
