title: attack-the-premise
summary: After repeated failed fixes, stop carrying the shared premise forward and recheck it.
type: principle
layer: principle
primary_cluster: principles
secondary_clusters: []
tags:
  - principle
inputs:
  - repeated failed fixes
outputs:
  - reframed premise / new hypothesis
handoffs: []
source_refs:
  - source: pstack-0-15-36-c742dd61
    path: skills/principle-attack-the-premise/SKILL.md
official_description: Apply when two or more fixes that share one premise have failed the same gate. Write the premise down and test it directly before you write another fix that assumes it.
status: active
mechanism: After repeated failed fixes, stop carrying the shared premise forward and recheck it. When two fixes based on the same premise fail the same gate, test that premise directly before attempting another fix.
when_to_use:
  - Apply when two or more fixes that share one premise have failed the same gate. Take a census of which actors hold the imbalance before the next fix, then question the premise instead of writing another fix that assumes it.
solves:
  - After repeated failed fixes, stop carrying the shared premise forward and recheck it.
