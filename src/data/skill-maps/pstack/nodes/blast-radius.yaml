handoffs: []
official_description: Find what a change could break somewhere else before it ships,
  beyond the diff, and prove the one fact it's safe because of by running real code
  instead of writing it up. Use for 'blast radius of X', 'what could this break',
  or reviewing a small diff you don't trust.
