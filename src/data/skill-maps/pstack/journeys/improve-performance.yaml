title: Optimize performance
summary: "Optimize performance: from task entry to inspectable output."
order: 3
inputs:
  - Explicit task objective and relevant context
source_refs: []
status: active
when_to_use:
  - This is slow
  - Make latency 50% lower
outputs:
  - measurement-backed performance improvement
variants:
  - id: standard
    title: Recommended path
    steps:
      - title: Select the measurement entry
        why: Enter through pstack's main router and work style, then measure, fix and demonstrate the one-off performance issue.
        nodes:
          - poteto-mode
          - perf-issue
        optional: false
        outputs: []
      - title: Validate measurement
        why: Check whether performance figures measure the intended work.
        nodes:
          - benchmark-checklist
        optional: false
        outputs: []
      - title: Understand the bottleneck
        why: Build a mental model of how the system works.
        nodes:
          - how
        optional: false
        outputs: []
      - title: Design the change
        why: Define types, interfaces, modules and data structures before coding.
        nodes:
          - architect
        optional: true
        when: The optimization affects system structure.
        outputs: []
      - title: Prepare the PR
        why: Turn a verified diff into a reviewable PR.
        nodes:
          - opening-a-pr
        optional: false
        outputs: []
      - title: Review and ship
        why: Progress the open PR/stack to merge-ready without final landing, then use independent verifiers to decide what may land.
        nodes:
          - babysit
          - shipping
        optional: true
        when: Delivery needs progression and the required authorization exists.
        outputs: []
  - id: alternative-1
    title: Continuously improve one metric
    when: Repeated measurement and improvement of one metric are needed.
    steps:
      - title: poteto-mode
        why: pstack's main router and work-style entry.
        nodes:
          - poteto-mode
        optional: false
        outputs: []
      - title: hillclimb
        why: Continuously optimize one metric through reversible iterations.
        nodes:
          - hillclimb
        optional: false
        outputs: []
      - title: benchmark-checklist
        why: Check whether performance figures measure the intended work.
        nodes:
          - benchmark-checklist
        optional: false
        outputs: []
      - title: show-me-your-work
        why: Condense long agent activity into an auditable decision trail.
        nodes:
          - show-me-your-work
        optional: false
        outputs: []
      - title: opening-a-pr
        why: Turn a verified diff into a reviewable PR.
        nodes:
          - opening-a-pr
        optional: false
        outputs: []
